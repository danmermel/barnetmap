<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <script src="./api_url.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
    }

    #map {
      /* configure the size of the map */
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>


  <script>
    // initialize Leaflet
    var map = L.map('map').setView({ lon: -0.2152903422555861, lat: 51.613290292918784 }, 12);

    // add the OpenStreetMap tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);

    async function load_postcodes() {
      //console.log("fetching pcs")
      let url = mem_url
      const response = await fetch(url)
      const postcodes = await response.json();
      //console.log("got pcs");
      return postcodes;
    }

    function getColor(d) {
      return d > 12 ? '#E53935' :
        d > 9 ? '#EF5350' :
          d > 6 ? '#E57373' :
            d > 3 ? '#EF9A9A' :
              '#FFCDD2';
    }

    async function main() {
      json = await load_postcodes();

      //console.log("building layers")

      memberlayer = L.geoJson(json, {
        style: function style(feature) {
          return {
            fillColor: getColor(feature.properties.member_percentage),
            weight: 2,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.7
          };
        },
        onEachFeature: function (feature, layer) {
          if (feature.properties) {
            //console.log("found ", feature.properties)
            let composite = `<table border="1" cellpadding="6" cellspacing="0">
                <thead>
                  <tr>
                    <th>Postcode</th>
                    <th>Member Count</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>${feature.properties.district}</td>
                    <td>${feature.properties.member_count}</td>
                  </tr>
                </tbody>
              </table>`
            layer.bindPopup(composite);

          }
        }
      })
      memberlayer.addTo(map)
    }

    let json = {} //global variables
    let memberlayer

    main()
    // show the scale bar on the lower left corner
    L.control.scale({ imperial: true, metric: true }).addTo(map);

  </script>
</body>

</html>
